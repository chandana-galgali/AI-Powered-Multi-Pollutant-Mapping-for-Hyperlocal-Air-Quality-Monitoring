<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sky gradient background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </radialGradient>
    <!-- Haze glow -->
    <radialGradient id="hazeGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <!-- AQI arc gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22c55e"/>
      <stop offset="30%"  stop-color="#facc15"/>
      <stop offset="60%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>

  <!-- Haze glow layer -->
  <ellipse cx="32" cy="40" rx="26" ry="14" fill="url(#hazeGlow)" clip-path="url(#circle-clip)"/>

  <!-- AQI arc (semi-circle) -->
  <!-- Full arc path: center (32,36), radius 18, from 180° to 0° -->
  <path
    d="M 14 36 A 18 18 0 0 1 50 36"
    fill="none"
    stroke="url(#arcGrad)"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Arc track (dim background) -->
  <path
    d="M 14 36 A 18 18 0 0 1 50 36"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Needle (pointing ~60% = orange zone) -->
  <!-- needle rotates from center (32,36), angle ≈ -36° from top (pointing right-ish) -->
  <line
    x1="32" y1="36"
    x2="46.5" y2="25"
    stroke="#f97316"
    stroke-width="2"
    stroke-linecap="round"
  />
  <!-- Needle pivot dot -->
  <circle cx="32" cy="36" r="2.5" fill="#f97316"/>

  <!-- PM2.5 / AQI label -->
  <text
    x="32" y="46"
    text-anchor="middle"
    font-family="'Arial', sans-serif"
    font-size="6"
    font-weight="700"
    fill="#94a3b8"
    letter-spacing="0.5"
  >AQI</text>

  <!-- Haze streaks (pollution particles) -->
  <line x1="10" y1="52" x2="22" y2="52" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="8"  y1="55" x2="18" y2="55" stroke="#94a3b8" stroke-width="1"   stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="14" y1="58" x2="26" y2="58" stroke="#94a3b8" stroke-width="1"   stroke-linecap="round" stroke-opacity="0.25"/>

  <line x1="40" y1="52" x2="55" y2="52" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="44" y1="55" x2="56" y2="55" stroke="#94a3b8" stroke-width="1"   stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="38" y1="58" x2="52" y2="58" stroke="#94a3b8" stroke-width="1"   stroke-linecap="round" stroke-opacity="0.25"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#334155" stroke-width="1.2"/>
</svg>
