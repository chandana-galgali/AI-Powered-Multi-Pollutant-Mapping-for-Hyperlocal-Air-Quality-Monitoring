# Render Blueprint: New → Blueprint → pick this repository.
services:
  - type: web
    name: hyperlocal-air-quality
    runtime: docker
    # free: 512 MB RAM, sleeps after 15 min idle (first visit then takes ~1 min), slow CPU.
    # For faster maps and bigger areas switch to "standard" (2 GB) and set MAX_PIXELS to 1600000.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEE_SERVICE_ACCOUNT_JSON   # paste the whole service-account JSON key
        sync: false
      - key: GEE_PROJECT                # your Earth Engine Cloud project id
        sync: false
      - key: MAX_PIXELS
        value: "900000"
