# Render Blueprint: New → Blueprint → pick this repository.
services:
  - type: web
    name: hyperlocal-air-quality
    runtime: docker
    plan: standard          # 2 GB RAM. On 512 MB plans set MAX_PIXELS=900000.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEE_SERVICE_ACCOUNT_JSON   # paste the whole service-account JSON key
        sync: false
      - key: GEE_PROJECT                # your Earth Engine Cloud project id
        sync: false
      - key: MAX_PIXELS
        value: "1600000"
